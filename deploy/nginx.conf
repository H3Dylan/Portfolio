# /etc/nginx/sites-available/portfolio
# Sert le build statique d'Astro. TLS et redirection HTTP->HTTPS sont gerees
# par Traefik en amont : ce vhost ecoute uniquement en clair sur le LAN.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dylanbouillon.fr www.dylanbouillon.fr _;

    # Racine = symlink bascule par deploy.sh vers la release courante
    root /var/www/portfolio/current;
    index index.html;

    # Vraie IP client dans les logs : IP du LXC 102 (reverse-proxy), statique.
    set_real_ip_from 192.168.1.102;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/portfolio.access.log;
    error_log  /var/log/nginx/portfolio.error.log;

    # Releve du homelab, depose par le noeud Proxmox. Il vit hors du dossier
    # de release : deploy.sh bascule un symlink et l emporterait sinon.
    location = /metrics.json {
        alias /var/www/portfolio/metrics.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Astro genere des dossiers : /page -> /page/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Assets hashes par Astro : immuables, cache long
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Le HTML doit toujours etre revalide, sinon un deploiement passe inapercu
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Actif seulement si un jour src/pages/404.astro existe ; sinon nginx sert sa
    # propre page 404, sans boucle.
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Pas de fuite de version, ni d'acces aux fichiers caches
    server_tokens off;
    location ~ /\. { deny all; }
}
